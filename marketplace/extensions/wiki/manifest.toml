id = "wiki"
name = "Wikipedia"
version = "1.0.0"
description = "Search English Wikipedia with 'wiki <topic>' and open the article."
author = "Zagros"
homepage = "https://github.com/avestura/zagros/tree/main/marketplace/extensions/wiki"
license = "MIT"
min_zagros = "0.1.0"
entry = "main.star"
keywords = ["wiki"]

permissions = ["network:en.wikipedia.org", "open", "clipboard.write"]

[[permission_detail]]
permission = "network:en.wikipedia.org"
reason = "Searches article titles on en.wikipedia.org. No other host is contacted."

[[permission_detail]]
permission = "open"
reason = "Opens the selected article in your browser."

[[permission_detail]]
permission = "clipboard.write"
reason = "Lets you copy the article link from the actions menu."

[[settings]]
key = "max_results"
type = "int"
default = 8
label = "Maximum results"
