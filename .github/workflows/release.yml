name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (needs a v* tag ref); false builds artifacts only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build and package
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v0.0.0-dev"; fi
          VERSION="${TAG#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            dir="build/${arch}"
            mkdir -p "$dir"
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -H=windowsgui -X main.version=${VERSION}" \
              -o "$dir/zagros.exe" ./cmd/zagros
            cp LICENSE README.md "$dir/"
            (cd "$dir" && zip -q -r "../../dist/zagros_${VERSION}_windows_${arch}.zip" .)
          done
          (cd dist && sha256sum *.zip > checksums.txt)
          cat dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        with:
          files: dist/*
          generate_release_notes: true
