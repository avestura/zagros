id = "dev.zagros.hello"
name = "Hello"
version = "1.0.0"
description = "Minimal example: type 'hello <name>' to get a greeting that copies to the clipboard."
author = "Zagros"
license = "MIT"
entry = "main.star"
keywords = ["hello"]
usage = "Type 'hello <name>' and press Enter to copy the greeting."
examples = ["hello world", "hello Zagros"]

permissions = ["clipboard.write"]

[[permission_detail]]
permission = "clipboard.write"
reason = "Copies the greeting when you press Enter."
